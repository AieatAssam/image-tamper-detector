rejected:
  - name: "SynthID detection"
    reason: "Google's SynthID verification is not available as a public library or API that this project can call. Any implementation would be fabricated."
  - name: "TruFor / Noiseprint++ / Comprint"
    reason: "D6 exclusion: available implementations are nonprofit-use-only, lack a verified compatible ONNX export/direct weight path for this runtime, and are incompatible with this repository's distribution terms; no substitute implementation or weights are claimed."
  - name: "Full PRNU camera attribution"
    reason: "requires ~50 flat-field reference images per camera. Out of scope for a stateless upload endpoint. Documented in the prnu entry above."
  - name: "Lighting / shadow geometry consistency"
    reason: "requires user-annotated correspondences to be reliable; the automatic variants are not robust enough to gate on"
