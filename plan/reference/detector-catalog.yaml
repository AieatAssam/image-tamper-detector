# ==============================================================================
# detector-catalog.yaml -- specification of every detector, existing and new
# ==============================================================================
# Each entry is precise enough to implement WITHOUT reading the cited paper.
# The citation is provenance, not required reading.
#
# `signal_direction` tells you which way the raw statistic moves for a
# manipulated image. Get this wrong and the confidence score inverts silently.
#
# `validated_by` names the corpus axis (see S05) that can legitimately test the
# detector. A detector whose validated_by is `real_camera` CANNOT be tested
# against generated splices -- see plan.yaml acceptance_tiers.
# ==============================================================================

catalog_version: 3

# R16C dual-axis input contract. These keys are runtime detector IDs, not the
# longer catalog entry names below. A detector is fitted and gated only on the
# listed variants, in addition to its `validated_by` axis scope.
variant_policy:
  variants: [native, parity]
  default_variant: native
  detector_scope:
    aeroblade: [parity]
    clip_probe: [parity]
    learned: [parity]
    npr: [parity]
    spectral: [parity]
    entropy: [parity]
    c2pa: [native]
    qtable: [native]
    exif: [native]
    cfa: [native]
    ela: [native]
    copy_move: [native, parity]
    double_jpeg: [native, parity]
    jpeg_ghosts: [native, parity]
    prnu: [native, parity]
    resampling: [native, parity]
    splicebuster: [native, parity]
    zero: [native, parity]

# ------------------------------------------------------------------------------
# EXISTING DETECTORS (reworked, not rewritten from scratch)
# ------------------------------------------------------------------------------
existing:

  ela:
    module: backend/app/analysis/ela.py
    class: ELAAnalyzer
    stage_owner: S03
    status: "implemented; paper-faithful raw residual plus repository heuristic features"
    principle: >
      JPEG is lossy at a fixed quantisation. Re-encoding an already-compressed
      region at a known quality changes it LESS than a region that was pasted in
      from a differently-compressed source. The per-pixel magnitude of that
      difference (the 'error level') is therefore spatially uniform in an
      authentic JPEG and spatially discontinuous around a splice.
    known_defect:
      id: ELA-1
      status: fixed
      location: "ela.py, in analyze()"
      description: "The residual now uses cv2.absdiff on the decoded input and one controlled JPEG resave, so unsigned subtraction cannot wrap."
      proof_command: ".venv/bin/python -m pytest backend/tests/test_ela.py -q"
    implementation:
      residual: "Decode the supplied image without a default resize, resave it once at quality=95, and return cv2.absdiff(input, resaved) as the raw ELA map."
      heuristic_features: "The analyzer retains edge, texture, noise, and block features as an explicitly repository-specific classifier; Krawetz's paper does not define these numeric features or thresholds."
      preprocessing: "A caller may opt into max_image_size, but the production default preserves the input pixel lattice because JPEG ELA is block-local."
    signal_direction: "manipulated -> HIGHER edge_discontinuity, HIGHER compression_artifacts"
    validated_by: [synthetic_splice, synthetic_recompress]
    citation: "N. Krawetz, 'A Picture's Worth: Digital Image Analysis and Forensics', Black Hat USA 2007"
    failure_modes:
      - "meaningless on PNG and any never-JPEG-compressed source (the analyzer re-encodes to JPEG first, manufacturing an error level that reflects nothing about the file's history)"
      - "a globally re-saved JPEG has uniform error level even when spliced"

  prnu:
    module: backend/app/analysis/prnu.py
    class: PRNUAnalyzer
    stage_owner: S08
    status: "implemented; Noisesniffer blind noise-inconsistency significance variant, which is NOT PRNU camera attribution"
    principle_true_prnu: >
      Every CMOS/CCD sensor has a fixed multiplicative gain pattern from silicon
      manufacturing variation. It is a per-CAMERA fingerprint. Genuine PRNU
      attribution requires a REFERENCE fingerprint estimated from ~50 flat-field
      images from the SAME camera, then correlating the query image's residual
      against it (peak-to-correlation-energy). This repo has no reference
      fingerprints and cannot do that.
    what_it_actually_does: >
      Implements the Noisesniffer block-selection and a-contrario NFA method:
      overlapping RGB blocks are screened for saturation, transformed with a
      DCT-II, selected by low-frequency energy and standard deviation, and
      tested with connected-cell binomial tails. The raw score is
      -log10(NFA), with paper defaults w=3, B=20000, n=0.1, m=0.5,
      l_beta=100, and the paper's constants 0.316915 and 4.062570. This is a
      blind noise-inconsistency cue, not PRNU camera attribution.
    required_action_S08:
      - "The public concept should say noise-residual inconsistency; the module may keep the prnu.py filename."
      - "The active score is Noisesniffer NFA significance; any threshold and scale are repository calibration, not the paper's epsilon=1 decision."
      - "No reference PRNU fingerprint is available, so this detector must not claim camera attribution."
    signal_direction: "lower NFA / higher -log10(NFA) -> HIGHER noise-inconsistency significance"
    validated_by: []
    citation: "M. Gardella, P. Musé, M. Colom, J.-M. Morel, 'Image Forgery Detection Based on Noise Inspection: Analysis and Refinement of the Noisesniffer Method', Image Processing On Line 14, 2024, article 462, https://www.ipol.im/pub/art/2024/462/"
    failure_modes:
      - "sensitive to resizing, heavy JPEG recompression, and denoising"
      - "cannot distinguish 'different camera' from 'edited' and is not a reference-fingerprint PRNU test"

  entropy:
    module: backend/app/analysis/entropy.py
    class: EntropyAnalyzer
    stage_owner: S04
    status: "implemented; blog-derived scalarization, not a peer-reviewed method"
    principle: >
      Computes a local Shannon entropy map per RGB channel over a disk
      footprint, then finds pixels where (a) the three channels' entropies agree
      within `tolerance`. Natural photographs are described by the source as
      having cohesive matching regions; the repository scalarizes the matching
      mask as a proportion and treats a lower proportion as more suspicious.
    verified_logic: "The adapter maps matching_proportion with the calibrated runtime threshold 0.6979472477; direct EntropyAnalyzer construction reads the legacy 0.35 default. Neither threshold is specified by the blog."
    claim_boundary: "The source is a blog post, not a paper; no paper-level method, threshold, confidence mapping, or classifier is claimed."
    implementation:
      method: "Compute raw local Shannon entropy for RGB channels with the blog's radius-5 disk and tolerance 0.1, then expose the matching-mask area as a repository scalar."
      preprocessing: "The ndarray/adapter path remains operationally bounded (ndarray longest side 1024; adapter input shared longest side 1600); path/bytes analysis is not capped by this module. These caps are not specified by the source."
    known_defect:
      id: ENT-1
      severity: HIGH
      description: >
        The endpoint returns confidence_score = 1 - matching_proportion
        UNCONDITIONALLY. An authentic image with matching_proportion 0.40
        reports is_tampered=false AND confidence 0.60. The number is not a
        confidence in the returned verdict. See api-contract.yaml.
    signal_direction: "AI-generated -> LOWER matching_proportion"
    validated_by: [real_ai, real_camera]
    citation: "F. Rohrer, 'Detecting AI-Generated Images Using Entropy Analysis', https://blog.frohrer.com/detecting-ai-generated-images-using-entropy-analysis/"
    failure_modes:
      - "single-blog-post heuristic with no peer review; treat its weight in fusion as low until S10 calibrates it"
      - "smooth authentic images (sky, studio backdrop) trigger it"

  c2pa:
    module: backend/app/analysis/c2pa.py
    class: C2PAAnalyzer
    stage_owner: S09
    status: "implemented with c2pa-python 0.37.8 Reader; validation-state aware; no manifest maps to NOT_APPLICABLE"
    verified_facts:
      - "backend/app/analysis/registry.py registers C2PAAnalyzer for the API detector registry"
      - "backend/tests/test_c2pa.py covers missing manifests, bytes, validation states, and MIME dispatch"
      - "c2pa-python 0.37.8 uses Reader(...).json(); validation_state distinguishes Well-Formed, Valid, Trusted, Invalid, and Error"
    principle: >
      C2PA is a signed, tamper-evident provenance manifest embedded in the file.
      Unlike every other detector here it is DECLARATIVE, not statistical: a
      valid manifest is strong positive evidence about origin, and a broken
      signature is strong evidence of post-signing modification. Absence of a
      manifest means nothing at all -- most images have none.
    critical_semantics:
      - "NO MANIFEST != TAMPERED. Absence maps to NOT_APPLICABLE with null score and no flag, weight 0."
      - "Only a c2pa.created generative assertion in a Valid or Trusted active manifest is a POSITIVE identification of AI generation, not a heuristic."
      - "Well-Formed is not treated as Valid; an unknown validation state is not scored as clean evidence."
    validated_by: [real_c2pa_signed, real_camera]
    citation: "C2PA Specification 2.x, https://c2pa.org/specifications/ ; python bindings https://github.com/contentauth/c2pa-python"
    variant_note: "Project adapter scores (0.95/1.0/0.05, threshold 0.5) are not C2PA constants; the claim_generator name list is only a fallback after Valid/Trusted state, and validation failures are typed by available failure codes."

# ------------------------------------------------------------------------------
# NEW DETECTORS
# ------------------------------------------------------------------------------
new:

  qtable_fingerprint:
    module: backend/app/analysis/qtable.py
    class: QuantizationTableDetector
    stage_owner: S06
    priority: 1
    rationale: "cheap metadata heuristic; useful only when camera provenance is claimed and must not be presented as universal encoder attribution"
    principle: >
      A JPEG file carries its own quantisation tables in the DQT marker. This
      repository reports a fingerprint and distance from two Annex-K-style
      libjpeg baselines as a provenance consistency heuristic. It does not
      identify an encoder: cameras and software can share tables, and a table
      match is not proof of a re-save.
    implementation:
      read_tables: "PIL: `img = Image.open(path); tables = img.quantization` -> dict {0: [64 ints], 1: [64 ints], ...} after Pillow converts the JPEG DQT zig-zag payload to natural table order. Present only for JPEG; absent/empty for PNG."
      estimate_quality: >
        Repository variant: for each table, compare against the libjpeg
        baseline luminance/chrominance tables (Annex K of ITU-T T.81) scaled by
        the standard formula:
          scale = 5000/Q for Q<50 else 200-2*Q
          value = clamp((base*scale + 50)/100, 1, 255)
        Report the Q in 1..100 minimising sum of absolute differences, and
        report that minimum distance as `libjpeg_distance`. The search range
        and L1 distance are engineering choices, not parameters specified by
        Farid's table-corpus paper.
      decision: >
        Combine the distance with EXIF Make/Model as a narrow consistency
        heuristic. Exact standard-table distance plus claimed camera
        provenance is suspicious, but is not an encoder identification or
        proof that generic software wrote the file.
      table_fingerprint: "sha256 of the concatenated tables, hex -- lets the app group images by encoder without shipping a database"
    signal_direction: "within the camera-provenance consistency heuristic, lower libjpeg_distance is more suspicious; no general encoder-attribution direction is claimed"
    validated_by: [synthetic_recompress, real_camera]
    citation: "Inspired by H. Farid, 'Digital Image Ballistics from JPEG Quantization', Dartmouth TR2006-583; the paper's camera/software table-corpus comparison is not implemented; ITU-T T.81 Annex K supplies the baseline tables."
    failure_modes: ["not applicable to PNG/WebP", "some camera firmwares do use standard tables", "no source-table database; exact distance is not proof of a software re-save"]
    constraints:
      - "DO NOT ship a bundled camera-table database in this stage. This entry is a repository variant inspired by the citation, not Farid's source-identification method."

  double_jpeg_benford:
    module: backend/app/analysis/double_jpeg.py
    class: DoubleJpegDetector
    stage_owner: S06
    priority: 2
    principle: >
      Repository variant inspired by the double-JPEG artifacts in Fu et al. and
      Bianchi–Piva: decoded-image DCT coefficient distributions are summarized
      by a generalized-Benford departure and a histogram periodicity ratio.
      These are related heuristics, not the papers' quantized-coefficient or
      likelihood-map implementations.
    implementation:
      dct_extraction: >
        Do NOT try to read raw DCT coefficients through PIL -- it does not
        expose them. Instead recompute: convert to YCbCr, take the Y plane,
        crop to a multiple of 8, split into non-overlapping 8x8 blocks, apply
        cv2.dct on each block cast to float32 minus 128.
      benford_test: >
        For the 20 lowest-frequency AC positions, pool decoded-DCT magnitudes,
        discard values below one, take leading decimal digits d in 1..9, and
        compare the empirical distribution to
          p(d) = N * log10(1 + 1/(s + d^q)).
        Fit s and q with a bounded least-squares optimizer and normalize N.
        The optimizer bounds are repository choices; this remains a decoded-DCT
        variant rather than a direct test of quantized JPEG-stream coefficients.
      periodicity_test: >
        For each of the same AC positions, build a histogram of integer
        coefficient values over range [-50, 50], take np.fft.rfft of the
        histogram, and measure the ratio of the largest non-DC magnitude to the
        mean magnitude. A ratio above the calibrated threshold indicates a
        periodic comb, i.e. recompression.
      output: "per-position scores plus a higher-is-worse aggregate; the map is decoded-DCT energy, not a calibrated double-JPEG likelihood"
    signal_direction: "recompressed -> HIGHER chi-square divergence, HIGHER periodicity ratio"
    validated_by: [synthetic_recompress]
    citation: >
      Inspired by D. Fu, Y.Q. Shi, W. Su, 'A generalized Benford's law for JPEG
      coefficients and its applications in image forensics', SPIE 2007, and
      T. Bianchi, A. Piva, 'Image Forgery Localization via Block-Grained
      Analysis of JPEG Artifacts', IEEE TIFS 2012. This repository does not
      implement either paper's quantized-stream/EM likelihood method.
    failure_modes: ["decoded-DCT heuristic is not a JPEG-stream coefficient test", "fixed crop origin has no non-aligned model", "blind to recompression at the SAME quality/alignment", "needs a reasonably sized image; skip below 256x256"]

  jpeg_ghosts:
    module: backend/app/analysis/ghosts.py
    class: JpegGhostDetector
    stage_owner: S06
    priority: 3
    principle: >
      Repository variant inspired by Farid's JPEG ghost premise: re-save the
      image over a bounded quality sweep, find local minima in the pixel-error
      curve, and summarize spatially separated q0 modes. This entry does not
      claim to reproduce the paper's region-selected K–S decision procedure.
    implementation:
      sweep: "q from 30 to 90 step 1, matching the paper's main experiment. For each q: re-encode with cv2.imencode('.jpg', img, [cv2.IMWRITE_JPEG_QUALITY, q]), decode, and compute per-pixel mean squared difference across channels."
      smoothing: "for each of the 64 8x8 window alignments, average the error map over disjoint BxB spatial blocks with B=16; ignore blocks with average intensity variance below 2.5 gray values"
      normalisation: "for each aligned block, min-max normalise its 61-point difference curve to [0,1]"
      decision: "argmin over q per aligned block gives q0 maps. Select the alignment with the strongest mode/coherence summary and report distinct spatial modes. A K-S statistic is diagnostic only; the paper's region-selected K-S decision is not implemented."
      cost_control: "MANDATORY application variant: downscale the longest side to <=1024 before the sweep. This resize is not a paper preprocessing step."
    signal_direction: "spliced -> multiple distinct spatially-coherent q0 modes"
    validated_by: [synthetic_splice]
    citation: "Inspired by H. Farid, 'Exposing Digital Forgeries from JPEG Ghosts', IEEE TIFS 4(1), 2009; the automatic mode summary remains a repository variant and does not implement the paper's region-selected K-S decision."
    failure_modes: ["only conditionally useful when an inserted region has lower quality than its host", "automatic mode summary is not the paper's K-S detector", "requires the spliced region to be reasonably large", "useless if the composite was flattened at a low quality that destroys both histories"]

  zero:
    module: backend/app/analysis/zero.py
    class: ZeroDetector
    stage_owner: S06
    priority: 2
    rationale: "paper-derived JPEG-grid evidence with an exact pixel vote and a bounded application resize"
    principle: >
      JPEG quantization leaves DCT coefficients near zero on the encoder's 8x8
      grid. A foreign grid or missing grid in a local region is evidence of a
      processing-history change. The ZERO method uses 64 grid phases, pixel
      votes, and binomial a-contrario NFA validation.
    implementation:
      luminance: "Round Y = 0.299R + 0.587G + 0.114B; use luminance only, as in the paper."
      voting: "Compute each valid 8x8 DCT once, count abs(coefficient)<0.5 over AC coefficients only, broadcast its count to the covered pixels, choose the phase with the largest count, and invalidate ties, direction-constant blocks, and the 7px border."
      validation: "For support n and votes v, use the paper's conservative /64 binomial model B(ceil(n/64), ceil(v/64), 1/64) and log10 NFA with 64^2*(XY)^2 multiplicity; NFA<1 is meaningful."
      local_foreign: "Use the W=9 neighborhood candidate-region heuristic and bounding-box NFA validation; this is bounded with OpenCV morphology rather than the reference implementation."
      missing_grid: "When a meaningful main grid exists, re-encode at JPEG QF=99, recompute votes, suppress pixels that initially voted for the main grid, and test grid 0 for missing-grid regions."
      cost_control: "Application variant: ImageContext caps the longest side at 1600 before voting; the paper operates on the input pixel lattice, so resized and native results require separate calibration."
    signal_direction: "lower log10 NFA (NFA < 1) for a foreign or missing grid is more suspicious"
    validated_by: [synthetic_splice]
    citation: "N. Nikoukhah et al., 'ZERO: a Local JPEG Grid Origin Detector Based on the Number of DCT Zeros and its Applications in Image Forensics', IPOL 11, 2021; local-region implementation retains a bounded morphology approximation."
    failure_modes: ["QF=100 has no forced zeros", "QF=1 and flat or directional blocks are rejected", "resizing changes the pixel-grid evidence", "local region search is a bounded approximation of the paper's greedy region growing"]

  copy_move:
    module: backend/app/analysis/copy_move.py
    class: CopyMoveDetector
    stage_owner: S07
    priority: 1
    rationale: "directly targets data/samples/tampered/landscape_copy_paste.jpg, which both ELA and the noise detector handle poorly because the source and destination share identical compression and sensor history"
    principle: >
      In a copy-move forgery the pasted content came from the SAME image, so it
      matches the source region in every statistic that ELA and PRNU measure.
      The giveaway is geometric: two distinct regions of the image are
      near-identical up to an affine transform.
    implementation:
      keypoints: >
        cv2.SIFT_create() -- available in the opencv main modules since 4.4.0
        (the patent expired); do NOT reach for opencv-contrib. Detect on the
        grayscale image, downscaled so the longest side is <= 1600.
      matching: >
        Match each descriptor against ALL OTHERS IN THE SAME IMAGE
        (self-matching). Apply Amerini's generalized 2NN test: retain all
        neighbours up to the first d_i/d_(i+1) ratio above T=0.5. Keep only
        mutual pairs as a bounded isolation guard before clustering.
      clustering: >
        Agglomeratively cluster the union of matched keypoint locations with
        Ward linkage and the inconsistency coefficient at Th=2.2. A repository
        depth-4 cut retains spatially coherent clusters; keep links between
        distinct clusters with at least three matches, following the paper's
        explicit detection rule.
      verification: >
        Normalize each linked point set to centroid zero and mean distance
        sqrt(2), then estimate a full affine homography with three-point
        RANSAC, beta=0.05, maxIters=1000, confidence=0.95, and OpenCV's bounded
        refinement. Keep clusters with at least three inliers. The inlier
        keypoints' convex hulls are the two regions to highlight.
      output: "a binary mask marking both source and destination regions, the affine matrix, and the inlier count"
    signal_direction: "copy-move present -> >=2 verified spatial clusters linked by matched pairs"
    validated_by: [synthetic_copymove]
    citation: >
      I. Amerini et al., 'A SIFT-Based Forensic Method for Copy-Move Attack
      Detection and Transformation Recovery', IEEE TIFS 6(3), 2011. The
      mutual-pair and depth-4 guards are repository variants of the paper's
      generalized-2NN and hierarchical-clustering core; the depth-4 cut
      remains a repository variant.
    failure_modes:
      - "fails on smooth/textureless pasted regions (sky, blank paper) where SIFT finds no keypoints -- this is a real limit, report it as low-confidence rather than as 'clean'"
      - "heavy post-blur on the paste reduces descriptor similarity"
    constraints:
      - "MUST report `insufficient_keypoints` as a distinct outcome from `no_forgery_found`. Conflating them produces confident false negatives on exactly the images this detector cannot see."

  cfa_periodicity:
    module: backend/app/analysis/cfa.py
    class: CfaDetector
    stage_owner: S08
    priority: 2
    rationale: "a sensor-provenance cue for strict full-resolution camera originals; it is not a sound generic AI-generation detector"
    principle: >
      A single-sensor camera captures one colour per pixel behind a Bayer colour
      filter array and INTERPOLATES the other two. Interpolated pixels are, by
      construction, smoother than acquired pixels. This leaves a 2x2-periodic
      variance pattern in the second derivative of each colour plane. A
      rendered, generated, or heavily resampled image has no such pattern.
    implementation:
      residual: "Independent Bammey reimplementation: bidirectional intermediate-value masks with a two-pixel border, global Bayer-pattern detection, and overlapping even windows."
      statistic: "Normalize diagonal and main-grid count differences by 1/(2XY), compute connected-component maxima for inconsistent windows, merge the diagonal and full-pattern confidence maps, and report their maximum as cfa_ratio."
      decision: "Threshold continuous confidence at the paper's gamma=0.2; unresolved global pattern returns not_applicable rather than a clean score."
      phase_selection: "Detect the green diagonal first, then select between the two compatible red/blue Bayer phases using the normalized main-grid difference."
      localisation: "Connected components of windows with a different diagonal or full Bayer pattern receive their component maximum confidence and are expanded to the image map."
      repository_gate: "Strict JPEG plus Make/Model plus matching PixelXDimension/PixelYDimension remains an image-side product precondition; the paper itself does not require EXIF."
    signal_direction: "local CFA-pattern inconsistency -> HIGHER cfa_ratio; no dominant pattern -> no CFA conclusion"
    validated_by: [real_camera]
    critical_note: >
      THIS DETECTOR CANNOT BE VALIDATED ON PNG AI AXES. A generated PNG and a
      genuine camera JPEG re-encoded to PNG can both lack a detectable Bayer
      pattern. The strict JPEG plus camera-EXIF gate remains in force.
    citation: >
      Q. Bammey, R. Grompone von Gioi, J.-M. Morel, 'Image Forgeries Detection
      through Mosaic Analysis: the Intermediate Values Algorithm', Image
      Processing On Line 11, article 355, 2021, doi:10.5201/ipol.2021.355.
      This replaces the prior Popescu--Farid/Ferrara citation mismatch.
    failure_modes:
      - "destroyed by any downscaling, so it is only meaningful on full-resolution originals -- CHECK image dimensions against EXIF and report `not_applicable` if the file was resized"
      - "Foveon/monochrome sensors and multi-shot pixel-shift modes have no CFA"
      - "absence of CFA structure in a PNG does not distinguish generation from camera capture followed by re-encoding"

  spectral_peaks:
    module: backend/app/analysis/spectral.py
    class: SpectralPeakDetector
    stage_owner: S08
    priority: 3
    status: "implemented; repository spectral-peak variant inspired by cited papers, not a paper reimplementation"
    principle: >
      GAN and diffusion decoders build images by repeated upsampling
      (transposed convolution or nearest/bilinear upsample + conv). Every such
      layer replicates the spectrum periodically, leaving a regular lattice of
      peaks in the magnitude spectrum of the image's HIGH-PASS RESIDUAL. Natural
      images have a smooth, roughly power-law spectrum with no such lattice.
    implementation:
      residual: "high-pass the grayscale image: residual = gray.astype(float32) - cv2.GaussianBlur(gray, (0,0), sigmaX=1.0). Using the residual rather than the image itself removes the dominant low-frequency content that would otherwise swamp the peaks."
      spectrum: "window with a 2-D Hann window (np.hanning outer product) to stop edge discontinuities producing cross artifacts, then np.fft.fft2, np.fft.fftshift, magnitude, log1p"
      radial_flattening: "compute the azimuthal average as a function of radius and subtract it, so what remains is only the ANISOTROPIC/periodic part"
      peak_statistic: "report max over the flattened spectrum divided by its standard deviation, excluding a radius-5 disc around DC. Also report the count of local maxima exceeding 4 sigma."
      resize_guard: "resize to a fixed 512x512 before the FFT so the peak lattice positions are comparable across images"
      preprocessing_gap: "Serving adds the shared longest-side 1600 cap before this fixed 512 resize; neither cited paper specifies that two-stage path or the heuristic peak thresholds."
      claim_boundary: "This is a repository spectral-peak variant inspired by the cited papers, not Zhang's RGB spectrum classifier or Durall's azimuthal-integration classifier. Their trained classifiers and training data are not present."
    signal_direction: "GAN/diffusion generated -> HIGHER peak-to-sigma ratio, MORE >4-sigma maxima"
    validated_by: [real_ai, real_camera]
    critical_note: "like cfa_periodicity, MUST NOT be validated on the synthetic splice corpus"
    citation: >
      X. Zhang, S. Karaman, S.-F. Chang, 'Detecting and Simulating Artifacts in
      GAN Fake Images', WIFS 2019;
      R. Durall, M. Keuper, J. Keuper, 'Watch your Up-Convolution: CNN Based
      Generative Deep Neural Networks are Failing to Reproduce Spectral
      Distributions', CVPR 2020
    failure_modes:
      - "modern diffusion models with learned upsamplers leave much weaker peaks than 2019-era GANs -- do not expect this alone to be decisive"
      - "JPEG recompression changes the spectrum; the cited papers do not prescribe a JPEG-grid mask, so this variant reports that processing sensitivity rather than claiming to remove it"

  exif_consistency:
    module: backend/app/analysis/exif.py
    class: ExifConsistencyDetector
    stage_owner: S09
    priority: 1
    principle: >
      Metadata is trivially forgeable and its ABSENCE proves nothing, but its
      INTERNAL INCONSISTENCY is meaningful: editors rewrite some fields and not
      others, and most of them do not regenerate the embedded thumbnail.
    checks:
      - id: EX1
        name: thumbnail_mismatch
        desc: >
          The strongest EXIF check by a wide margin. Extract the embedded JPEG
          thumbnail, decode it, resize the full image to the thumbnail's
          dimensions, and compare. Most editors update the main image and leave
          the original thumbnail intact, so a visible edit is often still
          present in un-edited form in the thumbnail. Report both a global
          similarity score and a per-region difference map -- the map is
          directly a tamper localisation.
        access: "Resolve the IFD1 JPEG offset/length pair against the container's EXIF payload; the implementation handles JPEG APP1, PNG/WEBP EXIF payloads, and TIFF IFD1 bytes without adding piexif."
      - id: EX2
        name: software_tag
        desc: "EXIF Software (0x0131) / ProcessingSoftware (0x000B) naming one of the documented editor markers (Photoshop, GIMP, Lightroom, Snapseed) is direct evidence of processing. Report the literal string; other software tags are recorded but are not strong editor evidence."
      - id: EX3
        name: missing_camera_block
        desc: "Make/Model/DateTimeOriginal/ExposureTime all absent while the file is a JPEG with camera-like dimensions. Weight LOW: social platforms strip EXIF wholesale."
      - id: EX4
        name: datetime_disagreement
        desc: "DateTimeOriginal (0x9003) vs DateTimeDigitized (0x9004) vs DateTime (0x0132). DateTime later than DateTimeOriginal indicates a re-save."
      - id: EX5
        name: dimension_disagreement
        desc: "EXIF PixelXDimension/PixelYDimension vs the actual decoded size. A mismatch means the file was resized after capture -- which also invalidates cfa_periodicity, so this check GATES that detector."
    signal_direction: "edited -> thumbnail mismatch, editor Software tag, datetime disagreement"
    validated_by: [real_camera, synthetic_recompress]
    citation: "no single paper; see the ExifTool documentation for tag semantics, https://exiftool.org/TagNames/EXIF.html; this remains a repository heuristic, not a paper reimplementation"
    failure_modes: ["absence proves nothing", "trivially forged by anyone who cares", "many platforms strip all EXIF"]
    constraints:
      - "NEVER map 'no EXIF' to tampered. It maps to `unknown`, weight 0."
      - "A non-empty Software/ProcessingSoftware tag outside the documented editor markers is not strong editor evidence."

  learned_onnx:
    module: backend/app/analysis/learned.py
    class: LearnedDetector
    stage_owner: S12
    priority: OPTIONAL
    status: "opt-in artifact-verified repository variant; no training-paper citation; image-gated to detectable faces and MUST degrade to `not_applicable` when the face or weights are absent"
    model:
      huggingface_repo: "onnx-community/Deep-Fake-Detector-v2-Model-ONNX"
      license: "apache-2.0"
      artifact: "onnx/model_quantized.onnx"
      alternative_artifacts: ["onnx/model.onnx (full fp32)", "onnx/model_fp16.onnx", "onnx/model_int8.onnx", "onnx/model_uint8.onnx"]
      verified_on: "2026-08-28 via https://huggingface.co/api/models/onnx-community/Deep-Fake-Detector-v2-Model-ONNX"
    preprocessing:
      source: "verified from the repo's preprocessor_config.json and config.json, NOT inferred"
      architecture: "ViTForImageClassification, image_size 224"
      steps:
        - "convert to RGB"
        - "resize to 224x224 with PIL resample=2 (BILINEAR) -- the config's `resample` value is literally 2"
        - "rescale: multiply by rescale_factor 0.00392156862745098 (i.e. 1/255)"
        - "normalise: (x - mean) / std with image_mean [0.5,0.5,0.5] and image_std [0.5,0.5,0.5]"
        - "transpose HWC -> CHW, add batch dim, dtype float32"
    applicability:
      face_gate: "Run OpenCV's bundled haarcascade_frontalface_default detector on the uploaded image; no detected face returns NOT_APPLICABLE before model inference."
    labels:
      source: "config.json id2label, verified"
      mapping: {0: "Realism", 1: "Deepfake"}
      note: "P(tampered) = softmax(logits)[1]. Verify the output tensor is logits, not probabilities, by checking that the two values do not sum to 1."
    constraints:
      - "This model was trained for FACE deepfakes. It is NOT a general splice detector and it is NOT a receipt/document forgery detector. Its fusion weight must be low and its scope must be stated in the UI. Do not present it as a general-purpose oracle."
      - "REJECTED ALTERNATIVE: TruFor / Noiseprint++. License is nonprofit-use-only (incompatible with this repo's MIT), no ONNX export, no direct weight URL. See plan.yaml decision D6."
      - "Torch is permitted only in the optional learned extra under decision D5b; keep imports lazy and default requirements, CI, and Docker torch-free."

  splicebuster:
    module: backend/app/analysis/splicebuster.py
    class: SpliceBusterDetector
    stage_owner: R8
    priority: 1
    status: "implemented; bounded paper-derived Gaussian-Gaussian EM variant with measured JPEG-quality applicability gate"
    principle: >
      A camera processing chain leaves a statistical fingerprint in
      high-frequency residuals. A pasted region from another chain changes the
      distribution of those residuals, even when compression and noise cues do
      not survive.
    implementation:
      residual: "Convert to grayscale and apply third-order horizontal and vertical derivative filters with reflected borders."
      quantization: "q = clip(round(r / 2), -1, +1), giving a three-symbol residual alphabet."
      cooccurrence: "Vectorize four-symbol sliding windows into 3^4 = 81 bins for each orientation; pool reversal/sign symmetries to 25 bins per orientation, concatenate to length 50, apply square-root unit-L2 normalization, then reduce to 25 dimensions with PCA."
      blocks: "Use 128x128 overlapping blocks at unit stride on a longest-side <=1024 analysis image."
      model: "Fit two Gaussian classes with 30 deterministic EM starts; the larger-prior class is treated as genuine and the raw map is its Mahalanobis-distance ratio to the other class."
      masking: "Exclude blocks whose mean is <=16 or >=255, or whose exact 0/255 saturation fraction exceeds 1%; these cutoffs are repository adaptations because the paper specifies the excluded areas but not these numeric cutoffs."
      score: "Report the maximum genuine-to-forged Mahalanobis distance ratio. Threshold 5.0 and scale 2.0 are repository calibration settings, not paper constants; the paper also discusses a Gaussian-uniform alternative, which is not selected here."
      applicability: "Require JPEG input with a lowest qtable-estimated libjpeg quality of at least 80; non-JPEG, missing-table, and lower-quality inputs return NOT_APPLICABLE."
    signal_direction: "different processing-chain population -> HIGHER genuine-to-forged Mahalanobis distance ratio"
    validated_by: [synthetic_splice]
    citation: "A. Cozzolino, G. Poggi, L. Verdoliva, 'Splicebuster: A New Blind Image Splicing Detector', IEEE WIFS 2015, DOI 10.1109/WIFS.2015.7368565"
    licensing: "Reimplemented from the paper. GRIP-UNINA source was not copied or translated."
    failure_modes:
      - "the Gaussian-Gaussian branch is selected; the paper's Gaussian-uniform alternative is not implemented"
      - "dense features are extracted at unit stride, but the bounded service fits PCA/EM on a deterministic maximum of 4096 feature rows"
      - "strong texture boundaries, content changes, or multiple legitimate pipelines can look like a splice"
      - "not applicable below estimated JPEG quality 80 or below 256px on either bounded analysis axis"

  resampling:
    module: backend/app/analysis/resampling.py
    class: ResamplingDetector
    stage_owner: R8
    priority: 2
    status: "implemented; repository adaptation of Kirchner's fast detector; exploratory because the corpus has no labeled resampling positive family"
    principle: >
      Interpolation makes pixels deterministic combinations of neighbors and
      creates periodic structure in prediction residuals. The detector measures
      that periodicity in a p-map's spectrum; it is a resampling cue, not a
      standalone attribution of an edit.
    implementation:
      predictor: "Use Kirchner's fixed 3x3 linear predictor, then p = exp(-(abs(e / 255))^2) for the uint8 service image; this is lambda=1, sigma=1, tau=2 after intensity normalization."
      spectrum: "Multiply the p-map by Popescu/Farid's radial window, Fourier transform it, apply their rotationally invariant high-pass filter and gamma=4 correction, and form Kirchner's first-quadrant cumulative periodogram."
      score: "Report the maximum Sobel gradient magnitude of the normalized cumulative periodogram. Threshold 0.115 and scale 0.04 are retained repository calibration settings; the cited papers determine thresholds empirically rather than prescribing these values."
      applicability: "Require both bounded analysis axes to be at least 256px; the service accepts the supported decoded formats and applies a longest-side <=1024 cap, which are deployment adaptations rather than Kirchner's never-compressed, nearest-neighbor factor-two experiment setup."
    signal_direction: "stronger periodic p-map anomaly -> HIGHER maximum cumulative-periodogram gradient; no global-resize exemption is claimed"
    validated_by: []
    citation: "A. C. Popescu, H. Farid, 'Exposing Digital Forgeries by Detecting Traces of Resampling', IEEE TSP 53(2), 2005, DOI 10.1109/TSP.2004.839932; M. Kirchner, 'Fast and Reliable Resampling Detection by Spectral Analysis of Fixed Linear Predictor Residue', ACM MM&Sec 2008, DOI 10.1145/1411328.1411333"
    licensing: "Reimplemented from the papers. No third-party source was copied or translated."
    failure_modes:
      - "the Popescu/Farid exhaustive synthetic-map similarity search is not implemented; Kirchner's cumulative-periodogram shortcut is used"
      - "the corpus has no labeled resampling positive family, so its AUC is exploratory"
      - "small or heavily compressed images may not preserve periodicity"
      - "JPEG and other service preprocessing can attenuate or introduce periodic artifacts relative to the cited never-compressed experiment"

  aeroblade:
    module: backend/app/analysis/aeroblade.py
    class: AerobladeDetector
    stage_owner: R8
    priority: OPTIONAL
    status: "implemented; repository AEROBLADE-style single-TAESD/LPIPS variant, not the paper's complete method"
    principle: >
      A latent-diffusion generator decodes through a VAE. Images generated by
      that VAE lie close to its reconstruction manifold, so the matching
      autoencoder reconstructs them with less error than ordinary photographs.
    implementation:
      models: "Externally supplied MIT madebyollin/taesd Diffusers artifact and LPIPS AlexNet cache; model files are not bundled."
      score: "Resize to a bounded multiple-of-eight shape, encode RGB [-1,1], decode, and compute LPIPS reconstruction error. Lower error is more suspicious."
      runtime: "Lazy torch, diffusers, and lpips imports; missing extra or model files returns NOT_APPLICABLE with score null."
      paper_gap: "The paper's Delta_Min is the minimum over SD1, SD2, and KD2.1 autoencoders and its strongest reported variant uses LPIPS_2; those external model assets and the paper's VGG16 configuration are not present."
      preprocessing_gap: "Serving uses the shared 1600-side cap followed by aspect-preserving bounded resize; the paper's real-image evaluation uses a 512x512 center crop."
    signal_direction: "latent-diffusion output -> LOWER LPIPS reconstruction error"
    validated_by: [real_ai, sd35_flux, synthbuster]
    citation: "J. Ricker, D. Lukovnikov, A. Fischer, 'AEROBLADE: Training-Free Detection of Latent Diffusion Images Using Autoencoder Reconstruction Error', CVPR 2024, arXiv:2401.17879"
    licensing: "Repository variant inspired by the paper. Runtime TAESD and CLIP-adjacent dependencies are permissively licensed; TAESD is MIT and all model bytes remain external."
    failure_modes:
      - "distilled TAESD is not the exact Stable Diffusion autoencoder used for the paper's headline results"
      - "latent-diffusion-only; useless against splicing, copy-move, or GAN output"
      - "opt-in and not applicable when optional dependencies or external model artifacts are absent"

  clip_probe:
    module: backend/app/analysis/clip_probe.py
    class: ClipProbeDetector
    stage_owner: R12
    priority: 1
    status: "implemented repository variant inspired by Ojha et al.; opt-in frozen CLIP ViT-L/14 linear probe; not a paper reproduction"
    principle: >
      A frozen broad visual representation can support an AI-generation screen
      whose linear probe generalizes across generator families. This repository
      variant uses a LAION checkpoint and multi-source training; it does not
      claim to reproduce the paper's augmentation or single-source protocol.
    implementation:
      backbone: "open-clip-torch ViT-L-14 with MIT-licensed LAION CLIP-ViT-L-14-laion2B-s32B-b82K weights; parameters are frozen. This differs from the paper's CLIP checkpoint."
      probe: "Fit only a repository linear probe with scripts/fit_clip_probe.py using source_image grouping and complete generator holdouts; paper blur/JPEG augmentation and its one-source training protocol are not implemented."
      applicability: "Check decoded format, minimum size, and local backbone/probe files from the image request; missing optional pieces return NOT_APPLICABLE."
    signal_direction: "higher linear-probe AI probability -> HIGHER suspicion"
    validated_by: [sd35_flux, synthbuster]
    citation: "A. Ojha, Y. Li, Y. J. Lee, 'Towards Universal Fake Image Detection', CVPR 2023"
    variant_note: "Resolution (b): no local training pipeline reproduces the paper's augmentation/checkpoint/protocol; treat this as an adaptation inspired by the citation, not a paper-faithful implementation."
    licensing: "MIT open-clip-torch and LAION ViT-L/14 weights; local probe trained from the repository corpus."
    failure_modes:
      - "AI rows are PNG and strict camera negatives are JPEG in this corpus; the perfect measured separation may contain a format/domain cue"
      - "not a splice localizer or a proof of origin; re-evaluate on re-encoded and cross-domain images"
      - "opt-in and not applicable when optional dependencies or external model artifacts are absent"

  npr:
    module: backend/app/analysis/npr.py
    class: NprDetector
    stage_owner: R10
    priority: 1
    status: "implemented; training-free NPR-inspired proxy, not the paper's trained detector, zero fusion weight"
    principle: >
      Upsampling can make neighboring pixels locally dependent. Relative
      differences inside aligned, non-overlapping 2x2 grids expose that
      dependency; the repository then applies a training-free proxy statistic.
    implementation:
      patches: "Aligned, non-overlapping 2x2 RGB grids with the first element as the reference; subtract it per channel from all four elements, including the zero reference relationship."
      statistics: "Report intra/inter variance ratio, near-constant grid fraction, and entropy of the quantized relationship distribution. These are repository proxy statistics, not the paper's classifier."
      score: "Equal-weight combination of near-constant fraction, inverse variance ratio, and inverse normalized difference entropy; mapped with a fixed exploratory calibration."
      applicability: "Require at least 4x4 pixels; all computation is derived from the input image."
      preprocessing_gap: "The 1024 longest-side cap is an operational serving choice; the paper does not specify it or the proxy's thresholds."
      paper_gap: "The paper's 1.44M-parameter CNN/ResNet classifier, ForenSynths training data, and trained weights are not present."
    signal_direction: "raw intra/inter variance ratio and entropy decrease -> HIGHER exploratory suspicion composite; calibration higher_is_worse remains true"
    physics_check: >
      The paper's premise predicts lower intra-patch variance, more
      near-constant patches, and lower difference entropy for generated output.
      The implementation inverts the first and third terms before combining
      them, so its final suspicion statistic has the physically correct higher
      direction. Round 11 data disagrees with that prediction on most
      generators; the sign was not flipped to improve AUC.
    validated_by: [real_ai, sd35_flux, synthbuster]
    citation: "C. Tan et al., 'Rethinking the Up-Sampling Operations in CNN-based Generative Network for Generalizable Deepfake Detection', CVPR 2024, arXiv:2312.10461"
    licensing: "Repository proxy inspired by the paper; the reference repository declares no license and its classifier weights are not used."
    failure_modes:
      - "This statistic is not the paper's trained classifier and should not be compared with its headline accuracy."
      - "Round 11's AI-axis AUC is below chance overall; fusion remains disabled."

