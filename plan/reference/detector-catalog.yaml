# ==============================================================================
# detector-catalog.yaml -- specification of every detector, existing and new
# ==============================================================================
# Each entry is precise enough to implement WITHOUT reading the cited paper.
# The citation is provenance, not required reading.
#
# `signal_direction` tells you which way the raw statistic moves for a
# manipulated image. Get this wrong and the confidence score inverts silently.
#
# `validated_by` names the corpus axis (see S05) that can legitimately test the
# detector. A detector whose validated_by is `real_camera` CANNOT be tested
# against generated splices -- see plan.yaml acceptance_tiers.
# ==============================================================================

catalog_version: 1

# ------------------------------------------------------------------------------
# EXISTING DETECTORS (reworked, not rewritten from scratch)
# ------------------------------------------------------------------------------
existing:

  ela:
    module: backend/app/analysis/ela.py
    class: ELAAnalyzer
    stage_owner: S03
    status: "implemented; contains a verified arithmetic defect"
    principle: >
      JPEG is lossy at a fixed quantisation. Re-encoding an already-compressed
      region at a known quality changes it LESS than a region that was pasted in
      from a differently-compressed source. The per-pixel magnitude of that
      difference (the 'error level') is therefore spatially uniform in an
      authentic JPEG and spatially discontinuous around a splice.
    known_defect:
      id: ELA-1
      severity: CRITICAL
      location: "ela.py, in analyze(), the line `ela = np.abs(high_array - low_array)`"
      description: >
        high_array and low_array are both dtype uint8 (they come from
        np.array(PIL.Image)). NumPy unsigned integer subtraction wraps modulo
        256. When low > high, e.g. high=10 low=20, the result is 246, not -10.
        np.abs() on an already-unsigned array is a no-op and cannot recover the
        sign. Roughly half of all pixel differences are therefore replaced by
        their 256-complement. Every downstream feature (edge_discontinuity,
        texture_variance, noise_consistency, compression_artifacts) and every
        tuned threshold is computed on corrupted data.
      fix: "cv2.absdiff(high_array, low_array) -- saturating, dtype-preserving, exactly the intended semantics"
      forbidden_fix: "np.abs(high.astype(np.int16) - low.astype(np.int16)) is numerically correct but changes dtype; if you use it you MUST cast back to uint8 before cv2 calls"
      proof_command: |
        .venv/bin/python -c "
        import numpy as np
        a=np.array([[10]],dtype=np.uint8); b=np.array([[20]],dtype=np.uint8)
        assert np.abs(a-b)[0,0] == 246, 'wraparound not reproduced'
        import cv2; assert cv2.absdiff(a,b)[0,0] == 10
        print('ELA-1 confirmed')"
    signal_direction: "manipulated -> HIGHER edge_discontinuity, HIGHER compression_artifacts"
    validated_by: [synthetic_splice, synthetic_recompress]
    citation: "N. Krawetz, 'A Picture's Worth: Digital Image Analysis and Forensics', Black Hat DC 2008"
    failure_modes:
      - "meaningless on PNG and any never-JPEG-compressed source (the analyzer re-encodes to JPEG first, manufacturing an error level that reflects nothing about the file's history)"
      - "a globally re-saved JPEG has uniform error level even when spliced"

  prnu:
    module: backend/app/analysis/prnu.py
    class: PRNUAnalyzer
    stage_owner: S08
    status: "implemented; measures local variance of a noise residual, which is NOT PRNU"
    principle_true_prnu: >
      Every CMOS/CCD sensor has a fixed multiplicative gain pattern from silicon
      manufacturing variation. It is a per-CAMERA fingerprint. Genuine PRNU
      attribution requires a REFERENCE fingerprint estimated from ~50 flat-field
      images from the SAME camera, then correlating the query image's residual
      against it (peak-to-correlation-energy). This repo has no reference
      fingerprints and cannot do that.
    what_it_actually_does: >
      Extracts a wavelet/Gaussian denoising residual and reports the mean LOCAL
      VARIANCE of that residual, thresholded at 300. That is a blind
      noise-inconsistency statistic, not PRNU. It is a legitimate forensic cue
      -- a spliced region often carries different noise energy -- but it must
      not be presented to users as camera-sensor attribution.
    required_action_S08:
      - "rename the public concept to `noise_residual_inconsistency` in API output and UI copy; the module may keep the prnu.py filename"
      - "keep a `prnu_reference` code path ONLY if a reference fingerprint is supplied; otherwise report capability as unavailable rather than faking it"
      - "the threshold 300 was chosen to make the two GPT-4o receipt samples pass; it is fitted to n=2 and must be recalibrated in S10"
    signal_direction: "manipulated/AI -> HIGHER local variance of the residual"
    validated_by: [real_camera, real_ai]
    citation: "J. Lukas, J. Fridrich, M. Goljan, 'Digital Camera Identification from Sensor Pattern Noise', IEEE TIFS 2006"
    failure_modes:
      - "destroyed by resizing, heavy JPEG recompression, and denoising"
      - "cannot distinguish 'different camera' from 'edited'"

  entropy:
    module: backend/app/analysis/entropy.py
    class: EntropyAnalyzer
    stage_owner: S04
    status: "implemented; decision logic is coherent, confidence mapping is not"
    principle: >
      Computes a local Shannon entropy map per RGB channel over a disk
      footprint, then finds pixels where (a) the three channels' entropies agree
      within `tolerance`, (b) the local entropy field is uniform, and (c) colour
      is locally consistent. Natural photographs contain a high proportion of
      such pixels; the claim is that generated images contain fewer.
    verified_logic: "is_ai_generated = matching_proportion < matching_threshold (0.35). Lower proportion => more likely AI. This direction is CORRECT."
    known_defect:
      id: ENT-1
      severity: HIGH
      description: >
        The endpoint returns confidence_score = 1 - matching_proportion
        UNCONDITIONALLY. An authentic image with matching_proportion 0.40
        reports is_tampered=false AND confidence 0.60. The number is not a
        confidence in the returned verdict. See api-contract.yaml.
    signal_direction: "AI-generated -> LOWER matching_proportion"
    validated_by: [real_ai, real_camera]
    citation: "F. Rohrer, 'Detecting AI-Generated Images Using Entropy Analysis', https://blog.frohrer.com/detecting-ai-generated-images-using-entropy-analysis/"
    failure_modes:
      - "single-blog-post heuristic with no peer review; treat its weight in fusion as low until S10 calibrates it"
      - "smooth authentic images (sky, studio backdrop) trigger it"

  c2pa:
    module: backend/app/analysis/c2pa.py
    class: C2PAAnalyzer
    stage_owner: S09
    status: "DEAD CODE AND BROKEN -- never imported by main.py, and written against a removed API"
    verified_facts:
      - "grep for 'c2pa' in backend/app/main.py returns nothing: no endpoint exposes it"
      - "backend/tests/test_c2pa.py exists but its pass/fail state is UNKNOWN (no venv existed to run it)"
      - "c2pa.Reader.from_file, reader.get_active_manifest and manifest.validate are all absent from c2pa-python 0.37.8"
    principle: >
      C2PA is a signed, tamper-evident provenance manifest embedded in the file.
      Unlike every other detector here it is DECLARATIVE, not statistical: a
      valid manifest is strong positive evidence about origin, and a broken
      signature is strong evidence of post-signing modification. Absence of a
      manifest means nothing at all -- most images have none.
    critical_semantics:
      - "NO MANIFEST != TAMPERED. The current code emits severity 'high' / 'no_manifest' for this, which is wrong and will dominate a naive fusion. Absence must map to `unknown`, weight 0."
      - "A manifest asserting c2pa.created by a generative tool is a POSITIVE identification of AI generation, not a heuristic. Weight it accordingly in S10."
    validated_by: [real_c2pa_signed, real_camera]
    citation: "C2PA Specification 2.x, https://c2pa.org/specifications/ ; python bindings https://github.com/contentauth/c2pa-python"

# ------------------------------------------------------------------------------
# NEW DETECTORS
# ------------------------------------------------------------------------------
new:

  qtable_fingerprint:
    module: backend/app/analysis/qtable.py
    class: QuantizationTableDetector
    stage_owner: S06
    priority: 1
    rationale: "cheapest high-signal detector in the whole plan: pure metadata read, no pixel maths, microseconds"
    principle: >
      A JPEG file carries its own quantisation tables in the DQT marker. Camera
      manufacturers, phone ISPs and editing software each use characteristic
      tables. libjpeg's standard tables scaled by a quality factor are what
      Photoshop 'Save for Web', GIMP, ImageMagick and Python PIL emit; camera
      firmware tables are usually distinguishable from them. An image claiming
      EXIF Make=Canon whose DQT matches the libjpeg q=90 standard table was
      re-saved by software.
    implementation:
      read_tables: "PIL: `img = Image.open(path); tables = img.quantization` -> dict {0: [64 ints], 1: [64 ints], ...} in ZIGZAG order. Present only for JPEG; absent/empty for PNG."
      estimate_quality: >
        For each table, compare against the libjpeg baseline luminance/chrominance
        tables (Annex K of ITU-T T.81) scaled by the standard formula:
          scale = 5000/Q for Q<50 else 200-2*Q
          value = clamp((base*scale + 50)/100, 1, 255)
        Report the Q in 1..100 minimising sum of absolute differences, and
        report that minimum distance as `libjpeg_distance`.
      decision: >
        libjpeg_distance == 0 -> table is EXACTLY a standard libjpeg table ->
        the file was written by generic software, NOT by camera firmware.
        Combine with EXIF Make/Model from the exif detector: a camera Make plus
        an exact libjpeg table is a strong re-save indicator.
      table_fingerprint: "sha256 of the concatenated tables, hex -- lets the app group images by encoder without shipping a database"
    signal_direction: "re-saved by software -> libjpeg_distance == 0 while EXIF claims a camera"
    validated_by: [synthetic_recompress, real_camera]
    citation: "H. Farid, 'Digital Image Ballistics from JPEG Quantization', Dartmouth TR2006-583; ITU-T T.81 Annex K"
    failure_modes: ["not applicable to PNG/WebP", "some camera firmwares do use standard tables"]
    constraints:
      - "DO NOT ship a bundled camera-table database in this stage. Report the fingerprint and the libjpeg distance; matching against a table corpus is a later, separate concern."

  double_jpeg_benford:
    module: backend/app/analysis/double_jpeg.py
    class: DoubleJpegDetector
    stage_owner: S06
    priority: 2
    principle: >
      An image compressed once has DCT coefficient magnitudes whose leading
      digits follow a generalised Benford distribution. Compressing a second
      time with a DIFFERENT quantisation step imposes a periodic comb on the
      coefficient histogram: bins that are multiples of the second quantiser get
      over-populated and neighbours get emptied. That periodicity is visible as
      a peak in the DFT of the coefficient histogram, and as a departure from
      Benford in the first-digit distribution.
    implementation:
      dct_extraction: >
        Do NOT try to read raw DCT coefficients through PIL -- it does not
        expose them. Instead recompute: convert to YCbCr, take the Y plane,
        crop to a multiple of 8, split into non-overlapping 8x8 blocks, apply
        cv2.dct on each block cast to float32 minus 128.
      benford_test: >
        For a fixed set of AC coefficient positions (use the 20 lowest-frequency
        AC positions in zigzag order, indices 1..20), pool |coefficient| over all
        blocks, discard zeros, take the leading decimal digit d in 1..9, and
        compare the empirical distribution to the generalised Benford model
          p(d) = N * log10(1 + 1/(s + d^q))
        Fit N, s, q by least squares per coefficient position. Report the
        chi-square divergence. Single-compressed images fit closely; double
        compressed images do not.
      periodicity_test: >
        For each of the same AC positions, build a histogram of integer
        coefficient values over range [-50, 50], take np.fft.rfft of the
        histogram, and measure the ratio of the largest non-DC magnitude to the
        mean magnitude. A ratio above the calibrated threshold indicates a
        periodic comb, i.e. recompression.
      output: "per-position scores plus an aggregate; also a block-level map so the frontend can localise"
    signal_direction: "recompressed -> HIGHER chi-square divergence, HIGHER periodicity ratio"
    validated_by: [synthetic_recompress]
    citation: >
      D. Fu, Y.Q. Shi, W. Su, 'A generalized Benford's law for JPEG coefficients
      and its applications in image forensics', SPIE 2007;
      T. Bianchi, A. Piva, 'Image Forgery Localization via Block-Grained
      Analysis of JPEG Artifacts', IEEE TIFS 2012
    failure_modes: ["blind to recompression at the SAME quality/alignment", "needs a reasonably sized image; skip below 256x256"]

  jpeg_ghosts:
    module: backend/app/analysis/ghosts.py
    class: JpegGhostDetector
    stage_owner: S06
    priority: 3
    principle: >
      Re-save the image at every quality q in a sweep and measure the per-pixel
      squared difference from the original. A region that was originally
      compressed at quality q0 shows a LOCAL MINIMUM in that difference when
      q == q0. If the image contains a spliced region carrying a different q0,
      two spatially separate minima appear at two different q -- the 'ghost'.
    implementation:
      sweep: "q from 50 to 100 step 2 (26 points). For each q: re-encode with cv2.imencode('.jpg', img, [cv2.IMWRITE_JPEG_QUALITY, q]), decode, compute per-pixel mean squared difference across channels."
      smoothing: "average the difference map over BxB spatial blocks with B=16 to suppress content-dependent noise"
      normalisation: "for each block, min-max normalise its 26-point difference curve to [0,1] so that content brightness does not dominate"
      decision: "argmin over q per block gives a q0 map. Report the number of distinct modes in the q0 histogram and the spatial coherence of each mode. >1 well-separated spatially-coherent mode => splice."
      cost_control: "MANDATORY: downscale the longest side to <=1024 before the sweep. 26 full-resolution JPEG round-trips is otherwise the slowest operation in the app."
    signal_direction: "spliced -> multiple distinct spatially-coherent q0 modes"
    validated_by: [synthetic_splice]
    citation: "H. Farid, 'Exposing Digital Forgeries from JPEG Ghosts', IEEE TIFS 4(1), 2009"
    failure_modes: ["requires the spliced region to be reasonably large", "useless if the composite was flattened at a low quality that destroys both histories"]

  copy_move:
    module: backend/app/analysis/copy_move.py
    class: CopyMoveDetector
    stage_owner: S07
    priority: 1
    rationale: "directly targets data/samples/tampered/landscape_copy_paste.jpg, which both ELA and the noise detector handle poorly because the source and destination share identical compression and sensor history"
    principle: >
      In a copy-move forgery the pasted content came from the SAME image, so it
      matches the source region in every statistic that ELA and PRNU measure.
      The giveaway is geometric: two distinct regions of the image are
      near-identical up to an affine transform.
    implementation:
      keypoints: >
        cv2.SIFT_create() -- available in the opencv main modules since 4.4.0
        (the patent expired); do NOT reach for opencv-contrib. Detect on the
        grayscale image, downscaled so the longest side is <= 1600.
      matching: >
        Match each descriptor against ALL OTHERS IN THE SAME IMAGE
        (self-matching). Use cv2.BFMatcher.knnMatch with k=3 rather than k=2,
        because the nearest neighbour of a keypoint is itself. Discard matches
        whose spatial distance between the two keypoints is below
        min_offset=32px -- otherwise every keypoint matches its own
        neighbourhood. Apply Lowe's ratio test at 0.75 to the remaining pairs.
      clustering: >
        Compute the offset vector (dx,dy) for every surviving match. Genuine
        copy-move produces a dense cluster of near-identical offsets. Cluster
        offsets with cv2.partition or a simple grid hash at 8px resolution;
        keep clusters with >= 8 members.
      verification: >
        For each surviving cluster run cv2.estimateAffinePartial2D with
        method=cv2.RANSAC, ransacReprojThreshold=3.0. Keep the cluster only if
        the inlier count is >= 8. The inlier keypoints' convex hulls are the two
        regions to highlight.
      output: "a binary mask marking both source and destination regions, the affine matrix, and the inlier count"
    signal_direction: "copy-move present -> >=1 verified affine cluster"
    validated_by: [synthetic_copymove]
    citation: >
      I. Amerini et al., 'A SIFT-Based Forensic Method for Copy-Move Attack
      Detection and Transformation Recovery', IEEE TIFS 6(3), 2011
    failure_modes:
      - "fails on smooth/textureless pasted regions (sky, blank paper) where SIFT finds no keypoints -- this is a real limit, report it as low-confidence rather than as 'clean'"
      - "heavy post-blur on the paste reduces descriptor similarity"
    constraints:
      - "MUST report `insufficient_keypoints` as a distinct outcome from `no_forgery_found`. Conflating them produces confident false negatives on exactly the images this detector cannot see."

  cfa_periodicity:
    module: backend/app/analysis/cfa.py
    class: CfaDetector
    stage_owner: S08
    priority: 2
    rationale: "a sensor-provenance cue for strict full-resolution camera originals; it is not a sound generic AI-generation detector"
    principle: >
      A single-sensor camera captures one colour per pixel behind a Bayer colour
      filter array and INTERPOLATES the other two. Interpolated pixels are, by
      construction, smoother than acquired pixels. This leaves a 2x2-periodic
      variance pattern in the second derivative of each colour plane. A
      rendered, generated, or heavily resampled image has no such pattern.
    implementation:
      residual: "Estimate the dominant Bayer arrangement with per-channel intermediate-value masks, then compare bounded local windows with that dominant arrangement."
      statistic: "Report the mean confidence of local windows whose estimated Bayer arrangement disagrees with the dominant arrangement; no dominant arrangement returns zero."
      decision: "Higher local inconsistency is more suspicious for a splice or other CFA-breaking operation. Absence of a dominant pattern is not mapped to AI generation."
      phase_selection: "Estimate the four Bayer arrangements from the intermediate-value masks and retain the strongest global arrangement."
      localisation: "The per-window inconsistency map identifies local disagreement with the dominant camera pattern."
    signal_direction: "local CFA-pattern inconsistency -> HIGHER cfa_ratio; no dominant pattern -> no CFA conclusion"
    validated_by: [real_camera]
    critical_note: >
      THIS DETECTOR CANNOT BE VALIDATED ON PNG AI AXES. A generated PNG and a
      genuine camera JPEG re-encoded to PNG can both lack a detectable Bayer
      pattern. The strict JPEG plus camera-EXIF gate remains in force.
    citation: >
      A.C. Popescu, H. Farid, 'Exposing Digital Forgeries in Color Filter Array
      Interpolated Images', IEEE TSP 53(10), 2005;
      P. Ferrara et al., 'Image Forgery Localization via Fine-Grained Analysis
      of CFA Artifacts', IEEE TIFS 7(5), 2012
    failure_modes:
      - "destroyed by any downscaling, so it is only meaningful on full-resolution originals -- CHECK image dimensions against EXIF and report `not_applicable` if the file was resized"
      - "Foveon/monochrome sensors and multi-shot pixel-shift modes have no CFA"
      - "absence of CFA structure in a PNG does not distinguish generation from camera capture followed by re-encoding"

  spectral_peaks:
    module: backend/app/analysis/spectral.py
    class: SpectralPeakDetector
    stage_owner: S08
    priority: 3
    principle: >
      GAN and diffusion decoders build images by repeated upsampling
      (transposed convolution or nearest/bilinear upsample + conv). Every such
      layer replicates the spectrum periodically, leaving a regular lattice of
      peaks in the magnitude spectrum of the image's HIGH-PASS RESIDUAL. Natural
      images have a smooth, roughly power-law spectrum with no such lattice.
    implementation:
      residual: "high-pass the grayscale image: residual = gray.astype(float32) - cv2.GaussianBlur(gray, (0,0), sigmaX=1.0). Using the residual rather than the image itself removes the dominant low-frequency content that would otherwise swamp the peaks."
      spectrum: "window with a 2-D Hann window (np.hanning outer product) to stop edge discontinuities producing cross artifacts, then np.fft.fft2, np.fft.fftshift, magnitude, log1p"
      radial_flattening: "compute the azimuthal average as a function of radius and subtract it, so what remains is only the ANISOTROPIC/periodic part"
      peak_statistic: "report max over the flattened spectrum divided by its standard deviation, excluding a radius-5 disc around DC. Also report the count of local maxima exceeding 4 sigma."
      resize_guard: "resize to a fixed 512x512 before the FFT so the peak lattice positions are comparable across images"
    signal_direction: "GAN/diffusion generated -> HIGHER peak-to-sigma ratio, MORE >4-sigma maxima"
    validated_by: [real_ai, real_camera]
    critical_note: "like cfa_periodicity, MUST NOT be validated on the synthetic splice corpus"
    citation: >
      X. Zhang, S. Karaman, S.-F. Chang, 'Detecting and Simulating Artifacts in
      GAN Fake Images', WIFS 2019;
      R. Durall, M. Keuper, J. Keuper, 'Watch your Up-Convolution: CNN Based
      Generative Deep Neural Networks are Failing to Reproduce Spectral
      Distributions', CVPR 2020
    failure_modes:
      - "modern diffusion models with learned upsamplers leave much weaker peaks than 2019-era GANs -- do not expect this alone to be decisive"
      - "JPEG recompression at low quality adds its own 8x8 lattice; MUST exclude the frequencies corresponding to the JPEG block grid (multiples of N/8) before computing the statistic, or every JPEG reads as generated"

  exif_consistency:
    module: backend/app/analysis/exif.py
    class: ExifConsistencyDetector
    stage_owner: S09
    priority: 1
    principle: >
      Metadata is trivially forgeable and its ABSENCE proves nothing, but its
      INTERNAL INCONSISTENCY is meaningful: editors rewrite some fields and not
      others, and most of them do not regenerate the embedded thumbnail.
    checks:
      - id: EX1
        name: thumbnail_mismatch
        desc: >
          The strongest EXIF check by a wide margin. Extract the embedded JPEG
          thumbnail, decode it, resize the full image to the thumbnail's
          dimensions, and compare. Most editors update the main image and leave
          the original thumbnail intact, so a visible edit is often still
          present in un-edited form in the thumbnail. Report both a global
          similarity score and a per-region difference map -- the map is
          directly a tamper localisation.
        access: "Pillow: Image.open(p).getexif().get_ifd(0x5100)  # IFD1, the thumbnail IFD. If Pillow does not expose the thumbnail bytes on this build, use piexif.load(path)['thumbnail']."
      - id: EX2
        name: software_tag
        desc: "EXIF Software (0x0131) / ProcessingSoftware (0x000B) naming an editor (Photoshop, GIMP, Lightroom, Snapseed) is direct evidence of processing. Report the literal string; do not maintain a hardcoded blocklist beyond a small documented set."
      - id: EX3
        name: missing_camera_block
        desc: "Make/Model/DateTimeOriginal/ExposureTime all absent while the file is a JPEG with camera-like dimensions. Weight LOW: social platforms strip EXIF wholesale."
      - id: EX4
        name: datetime_disagreement
        desc: "DateTimeOriginal (0x9003) vs DateTimeDigitized (0x9004) vs DateTime (0x0132). DateTime later than DateTimeOriginal indicates a re-save."
      - id: EX5
        name: dimension_disagreement
        desc: "EXIF PixelXDimension/PixelYDimension vs the actual decoded size. A mismatch means the file was resized after capture -- which also invalidates cfa_periodicity, so this check GATES that detector."
    signal_direction: "edited -> thumbnail mismatch, editor Software tag, datetime disagreement"
    validated_by: [real_camera, synthetic_recompress]
    citation: "no single paper; see the ExifTool documentation for tag semantics, https://exiftool.org/TagNames/EXIF.html"
    failure_modes: ["absence proves nothing", "trivially forged by anyone who cares", "many platforms strip all EXIF"]
    constraints:
      - "NEVER map 'no EXIF' to tampered. It maps to `unknown`, weight 0."

  learned_onnx:
    module: backend/app/analysis/learned.py
    class: LearnedDetector
    stage_owner: S12
    priority: OPTIONAL
    status: "opt-in extra; image-gated to detectable faces and MUST degrade to `not_applicable` when the face or weights are absent"
    model:
      huggingface_repo: "onnx-community/Deep-Fake-Detector-v2-Model-ONNX"
      license: "apache-2.0"
      artifact: "onnx/model_quantized.onnx"
      alternative_artifacts: ["onnx/model.onnx (full fp32)", "onnx/model_fp16.onnx", "onnx/model_int8.onnx", "onnx/model_uint8.onnx"]
      verified_on: "2026-08-28 via https://huggingface.co/api/models/onnx-community/Deep-Fake-Detector-v2-Model-ONNX"
    preprocessing:
      source: "verified from the repo's preprocessor_config.json and config.json, NOT inferred"
      architecture: "ViTForImageClassification, image_size 224"
      steps:
        - "convert to RGB"
        - "resize to 224x224 with PIL resample=2 (BILINEAR) -- the config's `resample` value is literally 2"
        - "rescale: multiply by rescale_factor 0.00392156862745098 (i.e. 1/255)"
        - "normalise: (x - mean) / std with image_mean [0.5,0.5,0.5] and image_std [0.5,0.5,0.5]"
        - "transpose HWC -> CHW, add batch dim, dtype float32"
    applicability:
      face_gate: "Run OpenCV's bundled haarcascade_frontalface_default detector on the uploaded image; no detected face returns NOT_APPLICABLE before model inference."
    labels:
      source: "config.json id2label, verified"
      mapping: {0: "Realism", 1: "Deepfake"}
      note: "P(tampered) = softmax(logits)[1]. Verify the output tensor is logits, not probabilities, by checking that the two values do not sum to 1."
    constraints:
      - "This model was trained for FACE deepfakes. It is NOT a general splice detector and it is NOT a receipt/document forgery detector. Its fusion weight must be low and its scope must be stated in the UI. Do not present it as a general-purpose oracle."
      - "REJECTED ALTERNATIVE: TruFor / Noiseprint++. License is nonprofit-use-only (incompatible with this repo's MIT), no ONNX export, no direct weight URL. See plan.yaml decision D6."
      - "NEVER add torch. See versions.lock.yaml optional_learned_model.torch."

  splicebuster:
    module: backend/app/analysis/splicebuster.py
    class: SpliceBusterDetector
    stage_owner: R8
    priority: 1
    status: "implemented; paper-only Mahalanobis variant with measured JPEG-quality applicability gate"
    principle: >
      A camera processing chain leaves a statistical fingerprint in
      high-frequency residuals. A pasted region from another chain changes the
      distribution of those residuals, even when compression and noise cues do
      not survive.
    implementation:
      residual: "Convert to grayscale and apply third-order horizontal and vertical derivative filters with reflected borders."
      quantization: "q = clip(round(r / 2), -1, +1), giving a three-symbol residual alphabet."
      cooccurrence: "Vectorize four-symbol sliding windows and encode each tuple into one of 3^4 = 81 bins; sum horizontal and vertical block histograms."
      blocks: "Use 128x128 overlapping blocks with 32px stride on a longest-side <=1024 analysis image."
      score: "Fit one regularized Gaussian to normalized block histograms and report max block Mahalanobis distance; the paper's two-component EM posterior is intentionally not implemented."
      applicability: "Require JPEG input with a lowest qtable-estimated libjpeg quality of at least 80; non-JPEG, missing-table, and lower-quality inputs return NOT_APPLICABLE."
    signal_direction: "different processing-chain population -> HIGHER maximum Mahalanobis distance"
    validated_by: [synthetic_splice]
    citation: "A. Cozzolino, G. Poggi, L. Verdoliva, 'Splicebuster: A New Blind Image Splicing Detector', IEEE WIFS 2015, DOI 10.1109/WIFS.2015.7368565"
    licensing: "Reimplemented from the paper. GRIP-UNINA source was not copied or translated."
    failure_modes:
      - "single-Gaussian distance is an approximation to the paper's EM model"
      - "strong texture boundaries, content changes, or multiple legitimate pipelines can look like a splice"
      - "not applicable below estimated JPEG quality 80 or below 256px on either bounded analysis axis"

  resampling:
    module: backend/app/analysis/resampling.py
    class: ResamplingDetector
    stage_owner: R8
    priority: 2
    status: "implemented; exploratory because the corpus has no labeled local-resampling positive family"
    principle: >
      Interpolation makes pixels deterministic combinations of neighbors and
      creates periodic structure in prediction residuals. A global resize is
      benign; tampering evidence is disagreement in that periodic signal across
      local blocks.
    implementation:
      predictor: "Use Kirchner's fixed 3x3 linear predictor and residual e = |I - P(I)|."
      spectrum: "For each 128x128 block, apply a 2-D Hann-windowed DFT to e and compute the non-DC peak-to-median spectral background ratio."
      score: "Report the 75th percentile absolute block deviation from the block-median peak ratio, not the global peak ratio. Use 64px block stride and a longest-side <=1024 analysis image."
      applicability: "Require at least 512px on both bounded axes so block disagreement is stable; smaller images abstain instead of calling global resampling tampering."
    signal_direction: "local resampling inconsistency -> HIGHER block-disagreement statistic; global resampling alone is not evidence"
    validated_by: []
    citation: "A. C. Popescu, H. Farid, 'Exposing Digital Forgeries by Detecting Traces of Resampling', IEEE TSP 53(2), 2005, DOI 10.1109/TSP.2004.839932; M. Kirchner, 'Fast and Reliable Resampling Detection by Spectral Analysis of Fixed Linear Predictor Residue', ACM MM&Sec 2008, DOI 10.1145/1411328.1411333"
    licensing: "Reimplemented from the papers. No third-party source was copied or translated."
    failure_modes:
      - "the synthetic corpus contains global resize negatives but no labeled local-resize positives, so its AUC is exploratory"
      - "small or heavily compressed images may not preserve periodicity"
      - "a global resize can be indistinguishable from benign processing and is intentionally not flagged"

  aeroblade:
    module: backend/app/analysis/aeroblade.py
    class: AerobladeDetector
    stage_owner: R8
    priority: OPTIONAL
    status: "implemented; opt-in TAESD ONNX approximation"
    principle: >
      A latent-diffusion generator decodes through a VAE. Images generated by
      that VAE lie close to its reconstruction manifold, so the matching
      autoencoder reconstructs them with less error than ordinary photographs.
    implementation:
      models: "Externally supplied MIT TAESD encoder.onnx and decoder.onnx; model files are not bundled."
      score: "Resize to the ONNX input shape, encode RGB [0,1], decode, and compute mean L1 reconstruction error. Lower error is more suspicious; LPIPS from the paper is not included."
      runtime: "Lazy onnxruntime import; missing runtime or either model returns NOT_APPLICABLE with score null."
    signal_direction: "latent-diffusion output -> LOWER mean L1 reconstruction error"
    validated_by: [real_ai]
    citation: "J. Ricker, D. Lukovnikov, A. Fischer, 'AEROBLADE: Training-Free Detection of Latent Diffusion Images Using Autoencoder Reconstruction Error', CVPR 2024, arXiv:2401.17879"
    licensing: "Detection algorithm reimplemented from the paper. Runtime TAESD ONNX artifacts are adapted from MIT-licensed madebyollin/taesd via the pinned MIT conversion revision recorded in aeroblade.py."
    failure_modes:
      - "distilled TAESD is not the exact Stable Diffusion autoencoder used for the paper's headline results"
      - "mean L1 is weaker than the paper's LPIPS distance"
      - "latent-diffusion-only; useless against splicing, copy-move, or GAN output"
      - "opt-in and not applicable when external ONNX artifacts are absent"

  npr:
    module: backend/app/analysis/npr.py
    class: NprDetector
    stage_owner: R10
    priority: 1
    status: "implemented; training-free statistic derived from the paper representation, zero fusion weight"
    principle: >
      Upsampling can make neighboring pixels locally dependent. Relative
      differences inside overlapping 2x2 patches expose that dependency while
      avoiding any learned weights.
    implementation:
      patches: "Overlapping 2x2 RGB patches with the fourth element used as the reference; subtract it from all four elements."
      statistics: "Report intra/inter variance ratio, near-constant patch fraction, and entropy of the quantized difference distribution."
      score: "Equal-weight combination of near-constant fraction, inverse variance ratio, and inverse normalized difference entropy; mapped with a fixed exploratory calibration."
      applicability: "Require at least 4x4 pixels; all computation is derived from the input image."
    signal_direction: "raw intra/inter variance ratio and entropy decrease -> HIGHER exploratory suspicion composite; calibration higher_is_worse remains true"
    physics_check: >
      The paper's premise predicts lower intra-patch variance, more
      near-constant patches, and lower difference entropy for generated output.
      The implementation inverts the first and third terms before combining
      them, so its final suspicion statistic has the physically correct higher
      direction. Round 11 data disagrees with that prediction on most
      generators; the sign was not flipped to improve AUC.
    validated_by: [real_ai, sd35_flux, synthbuster]
    citation: "C. Tan et al., 'Rethinking the Up-Sampling Operations in CNN-based Generative Network for Generalizable Deepfake Detection', CVPR 2024, arXiv:2312.10461"
    licensing: "Paper-only reimplementation; the reference repository declares no license and its classifier weights are not used."
    failure_modes:
      - "This statistic is not the paper's trained classifier and should not be compared with its headline accuracy."
      - "Round 11's AI-axis AUC is below chance overall; fusion remains disabled."

