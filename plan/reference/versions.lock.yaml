# ==============================================================================
# versions.lock.yaml -- EMPIRICALLY RESOLVED, DO NOT EDIT FROM MEMORY
# ==============================================================================
# Every version below was read from the live PyPI / npm registry on 2026-08-28.
# The `evidence` field records what was actually observed. Agents copy these
# pins VERBATIM into requirements.txt / package.json.
#
# If you believe a version here is wrong, DO NOT substitute your own. Re-run the
# `resolution_commands` below and report the discrepancy.
# ==============================================================================

resolved_on: "2026-08-28"
resolution_commands:
  pypi: |
    curl -s https://pypi.org/pypi/<NAME>/json | python3 -c 'import sys,json;d=json.load(sys.stdin)["info"];print(d["version"], d.get("requires_python"))'
  pypi_wheel_tags: |
    curl -s https://pypi.org/pypi/<NAME>/json | python3 -c "
    import sys,json
    d=json.load(sys.stdin); v=d['info']['version']
    print([f['filename'] for f in d['releases'][v] if f['packagetype']=='bdist_wheel'])"
  npm: "npm view <NAME> version"

python:
  target: "3.14"
  local_observed: "3.14.7"
  docker_base_image: "python:3.14-slim"
  note: >
    Dockerfile currently says python:3.12-slim. numpy 2.5.2 and scipy 1.18.1
    both declare requires_python >=3.12, so 3.12 would still work, but the
    local dev interpreter is 3.14.7 and every dependency has a cp314/abi3
    wheel. Pinning one version across venv, Dockerfile and CI removes the
    current three-way contradiction.

