backend_keep:
  numpy:
    pin: "==2.5.2"
    was: ">=1.21.0"
    requires_python: ">=3.12"
    evidence: "cp314 wheels present (numpy-2.5.2-cp314-cp314-macosx_11_0_arm64.whl et al)"
    breaking_risk: HIGH
    breaking_notes: >
      numpy 2.x removed np.float_, np.int0, np.NaN, np.Inf; changed the
      promotion rules (NEP 50) so that uint8 arithmetic with a Python int no
      longer silently upcasts. THIS DIRECTLY AFFECTS backend/app/analysis/*.
      Expect numeric drift in every threshold. This is why S00 captures a
      baseline BEFORE upgrading.
  opencv-python-headless:
    pin: "==4.14.0.94"
    was: "opencv-python>=4.5.3"
    evidence: "wheels are cp37-abi3 (opencv_python_headless-4.14.0.94-cp37-abi3-manylinux_2_28_x86_64.whl) -> installs on cp314"
    breaking_risk: MEDIUM
    breaking_notes: >
      Package RENAMED from opencv-python to opencv-python-headless. Import name
      is unchanged (`import cv2`). Do NOT install both. See decision D2 for why
      not 5.0.0.93.
  pillow:
    pin: "==12.3.0"
    was: ">=8.3.1"
    requires_python: ">=3.10"
    evidence: "cp314 wheels present"
    breaking_risk: MEDIUM
    breaking_notes: >
      Image.ANTIALIAS and other bare constants were removed in Pillow 10;
      Image.Resampling.LANCZOS (already used in ela.py) is correct and stays.
      Verify Image.open() lazy-loading behaviour with the new decoder limits.
  scipy:
    pin: "==1.18.1"
    was: ">=1.7.0"
    requires_python: ">=3.12"
    evidence: "scipy-1.18.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
    breaking_risk: MEDIUM
    used_by: "prnu.py (scipy.signal, scipy.interpolate.griddata, scipy.ndimage)"
  scikit-image:
    pin: "==0.26.0"
    was: ">=0.19.0"
    requires_python: ">=3.11"
    evidence: "scikit_image-0.26.0-cp314-cp314-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl"
    breaking_risk: HIGH
    breaking_notes: >
      skimage.filters.rank.entropy and skimage.morphology.disk are used by
      entropy.py. skimage renamed `selem` -> `footprint` in the rank filters
      (deprecated 0.19, REMOVED in 0.20). entropy.py stores self.selem but
      check every call site for a `selem=` keyword argument.
  PyWavelets:
    pin: "==1.9.0"
    was: "(no specifier -- unpinned)"
    requires_python: ">=3.11"
    evidence: "pywavelets-1.9.0-cp314-cp314-macosx_11_0_arm64.whl"
    used_by: "prnu.py (import pywt, wavelet denoising)"
    breaking_risk: LOW
  fastapi:
    pin: "==0.141.1"
    was: ">=0.104.1"
    requires_python: ">=3.10"
    breaking_risk: MEDIUM
    breaking_notes: "on_event handlers deprecated in favour of lifespan; Query/Path Annotated form now preferred"
  uvicorn:
    pin: "==0.52.4"
    was: ">=0.24.0"
    breaking_risk: LOW
    extras: "[standard]"
  pydantic:
    pin: "==2.13.5"
    was: ">=2.5.2"
    breaking_risk: LOW
    breaking_notes: "class Config is deprecated -> use model_config = ConfigDict(...). main.py uses class Config in two models."
  python-multipart:
    pin: "==0.0.32"
    was: ">=0.0.6"
    breaking_risk: LOW
  c2pa-python:
    pin: "==0.37.8"
    was: ">=0.6.0"
    requires_python: ">=3.10"
    evidence: "c2pa_python-0.37.8-py3-none-manylinux_2_28_x86_64.whl (pure py3-none, ABI independent)"
    breaking_risk: CRITICAL
    breaking_notes: >
      VERIFIED AGAINST THE OFFICIAL usage.md: the API used by the existing
      backend/app/analysis/c2pa.py NO LONGER EXISTS.
        REMOVED: c2pa.Reader.from_file(path)
        REMOVED: reader.get_active_manifest()
        REMOVED: manifest.validate()
      CURRENT API:
        from c2pa import Reader, Context, Settings
        with Reader("path/to/file.jpg") as reader: data = json.loads(reader.json())
        with Reader("image/jpeg", stream) as reader: data = json.loads(reader.json())
        reader.resource_to_stream(uri, stream)   # thumbnails etc.
      The JSON manifest store contains keys: `active_manifest` (a string id),
      `manifests` (map id -> manifest), and `validation_status` /
      `validation_results` present ONLY when validation problems occurred.
      Handled by stage S09.
  pytest:
    pin: "==9.1.1"
    was: "(unpinned)"
    breaking_risk: MEDIUM
    breaking_notes: "pytest 8+ removed nose-style setup/teardown; asyncio needs an explicit plugin"
  pytest-xdist:
    pin: "==3.8.0"
    extras: "[psutil]"

