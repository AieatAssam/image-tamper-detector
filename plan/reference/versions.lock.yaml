    verify_command: "curl -s https://pypi.org/pypi/httpx/json | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"info\"][\"version\"])'"
    note: "THIS PIN IS THE ONE VALUE IN THIS FILE THAT WAS NOT RESOLVED ON 2026-08-28. Run verify_command and use whatever it prints."
  pytest-cov:
    pin: "resolve_at_install"
    verify_command: "curl -s https://pypi.org/pypi/pytest-cov/json | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"info\"][\"version\"])'"
  piexif:
    pin: "==1.1.3"
    reason: "S09 EXIF consistency detector -- reads/writes raw EXIF including the embedded JPEG thumbnail, which Pillow's getexif() does not expose conveniently"
    note: "Pillow's Image.getexif() covers most needs; piexif is only required for thumbnail extraction. If S09 finds Pillow sufficient, DROP this dependency rather than adding it."

